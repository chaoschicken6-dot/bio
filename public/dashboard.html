<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Your page</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css"></head><body>
<main class="card" style="max-width:720px"><h1>Your page</h1><p class="tagline" id="url">&nbsp;</p>
<form id="f">
<label>Link name<input name="slug" maxlength="24"></label>
<label>Display name<input name="name" maxlength="40"></label>
<label>Tagline<input name="tagline" maxlength="120"></label>
<div class="row"><label>Location<input name="location" maxlength="40"></label><label>Status text<input name="status" maxlength="30" placeholder="Open to work"></label></div>
<label>About<textarea name="about" rows="3" maxlength="600"></textarea></label>
<label>Skills (comma separated)<input name="skills"></label>
<label>Socials (one per line: Name | handle | https://link)<textarea name="socials" rows="5"></textarea></label>
<label>Experience (one per line: Role | Company | Dates | point; point)<textarea name="experience" rows="5"></textarea></label>
<div class="row"><label>Accent colour<input type="color" name="accent"></label><label class="chk"><input type="checkbox" name="useAvatar">Use my Discord avatar</label></div>
<fieldset><legend>Badges</legend>
<label class="chk"><input type="checkbox" name="showDBadges">Show my Discord badges (imported when you log in)</label>
<label class="chk s"><input type="checkbox" name="b_dev">💻 Developer</label><label class="chk s"><input type="checkbox" name="b_design">🎨 Designer</label><label class="chk s"><input type="checkbox" name="b_creator">🎬 Creator</label><label class="chk s"><input type="checkbox" name="b_gamer">🎮 Gamer</label></fieldset>
<fieldset><legend>Music</legend>
<label>Direct audio link (.mp3, .ogg or .wav URL)<input name="musicUrl" type="url" placeholder="https://…/song.mp3"></label>
<label>Track title<input name="musicTitle" maxlength="60"></label>
<label class="chk"><input type="checkbox" name="musicGate">Show a "Click to enter" screen so the music can autoplay</label></fieldset>
<fieldset><legend>Discord account status</legend>
<label class="chk"><input type="checkbox" name="acctShow">Show a small status button on my page</label>
<div class="row"><label>Status<select name="acctState"><option value="active">Active</option><option value="limited">Limited</option><option value="terminated">Terminated</option></select></label>
<label>New account (username or ID)<input name="newAccount" maxlength="60"></label></div></fieldset>
<div class="bar"><button class="btn" type="submit">Save</button><span id="msg"></span><a href="/logout" style="margin-left:auto">Log out</a></div>
</form></main><script src="/assets/dashboard.js"></script></body></html>
